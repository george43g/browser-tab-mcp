[mcp_servers.browser-tab-mcp-dev]
command = "pnpm"
args = ["tsx", "apps/browser-tab-mcp/scripts/mcp-dev-proxy.ts"]

[mcp_servers.browser-tab-mcp-dev.env]
MCP_DEV = "1"
MCP_DEV_CMD = "pnpm tsx apps/browser-tab-mcp/src/index.ts"
MCP_DEV_WATCH_DIR = "apps/browser-tab-mcp/src"

[mcp_servers.mise]
command = "mise"
args = ["mcp"]
