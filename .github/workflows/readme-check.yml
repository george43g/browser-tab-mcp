# README-update check — fails CI when a workspace's src/** changes without
# ITS README (the nearest one up-tree, else the root README; see
# scripts/readme-check.mjs, BACKLOG B27). Bypass with [skip-readme] in the
# commit message or PR title.
#
# Lifted from Gmail-MCP-Server's pattern.

name: README check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  readme-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check skip flag
        id: skip
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          COMMIT_MSG=$(git log -1 --format=%s)
          if echo "$COMMIT_MSG" | grep -qiE '\[(skip-readme|no-readme)\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif echo "$PR_TITLE" | grep -qiE '\[(skip-readme|no-readme)\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif echo "$COMMIT_MSG" | grep -qiE '^Merge branch'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: PR — verify README was updated alongside src
        if: github.event_name == 'pull_request' && steps.skip.outputs.skip == 'false'
        run: |
          DIFF_RANGE="origin/${{ github.base_ref }}...HEAD"
          # A failed `git diff` (unfetched base, bad range) must go RED, not
          # read as an empty diff — "cannot see what changed" is not "nothing
          # changed", and piping straight into grep conflated the two, which
          # silently disabled this check on exactly the runs it couldn't see.
          if ! CHANGED=$(git diff --name-only $DIFF_RANGE); then
            echo "::error::git diff $DIFF_RANGE failed — the check cannot see what changed, so it cannot pass."
            exit 1
          fi
          printf '%s\n' "$CHANGED" | node scripts/readme-check.mjs

      - name: Push — verify README was updated alongside src
        if: github.event_name == 'push' && steps.skip.outputs.skip == 'false'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            DIFF_RANGE="HEAD~1..HEAD"
          else
            DIFF_RANGE="$BEFORE_SHA..HEAD"
          fi
          # Same rule as the PR step: a diff that FAILED (e.g. BEFORE_SHA gone
          # after a force push) is not a diff that was EMPTY.
          if ! CHANGED=$(git diff --name-only $DIFF_RANGE); then
            echo "::error::git diff $DIFF_RANGE failed — the check cannot see what changed, so it cannot pass."
            exit 1
          fi
          printf '%s\n' "$CHANGED" | node scripts/readme-check.mjs
