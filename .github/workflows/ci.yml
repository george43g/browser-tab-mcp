name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["24"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.29.3

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Shellcheck (safari packaging scripts)
        # Static analysis is OS-independent; run once on Linux. shellcheck is
        # preinstalled on GitHub's Ubuntu runners.
        if: runner.os == 'Linux'
        run: shellcheck apps/safari-extension/scripts/*.sh

      - name: Typecheck
        run: pnpm typecheck

      - name: Build (TS workspace + optional native)
        run: pnpm build

      - name: Test (default — native path when built)
        run: pnpm test

      - name: Test (TS fallback path)
        env:
          MCP_DISABLE_NATIVE: "1"
        run: pnpm test:no-native

      - name: Coverage (collect + report — non-gating)
        # COVERAGE=1 collects + writes lcov (CI reporter). COVERAGE_GATE is
        # intentionally unset: we report coverage but don't fail on thresholds
        # yet. Arm the gate later by adding COVERAGE_GATE=1 here.
        run: COVERAGE=1 pnpm test
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: "**/coverage/lcov.info"
          if-no-files-found: ignore

      - name: Install usage(1) via mise
        # The freshness gate (next step) shells out to usage(1) to
        # regenerate completions + manpage + docs; mise pulls a pinned
        # binary so the check is reproducible across runners.
        uses: jdx/mise-action@v4

      - name: Check usage(1) artifacts are fresh vs .usage.kdl
        # Fails the build if completions/, man/, or docs/cli/ drifted
        # since the last regen. Fix locally: `pnpm artifacts && git add
        # completions/ man/ docs/cli/`. Bypass: edit .usage.kdl + this
        # check together in the same PR.
        run: pnpm --filter "@george43g/*-mcp" check:usage

      - name: Verify npm tarball is publishable
        run: pnpm --filter "@george43g/*-mcp" exec npm pack --dry-run

      - name: Stress harness (10 cases · daemon + dispatch lifecycle)
        run: pnpm --filter "@george43g/*-mcp" stress
      - name: Upload stress report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stress-report-${{ matrix.os }}
          path: apps/**/stress-*-report.json
          if-no-files-found: ignore

  # Deferred: headed-Chromium E2E of the built extension against a throwaway
  # daemon. Scaffolded but gated off so it never runs the hot matrix. Flip the
  # `if:` to a label/dispatch trigger (and fill in the steps) when picked up.
  # Safari is NOT automatable — keep the manual smoke checklist in
  # apps/safari-extension/README.md. See docs/FOLLOWUPS.md § 1 (P3).
  e2e-chromium:
    name: e2e (chromium, deferred)
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: echo "Placeholder — build chrome-extension, playwright install chromium, run e2e/*.e2e.test.ts"
