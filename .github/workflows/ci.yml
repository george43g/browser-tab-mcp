name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["24"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.29.3

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build (TS workspace + optional native)
        run: pnpm build

      - name: Test (default — native path when built)
        run: pnpm test

      - name: Test (TS fallback path)
        env:
          MCP_DISABLE_NATIVE: "1"
        run: pnpm test:no-native

      - name: Install usage(1) via mise
        # The freshness gate (next step) shells out to usage(1) to
        # regenerate completions + manpage + docs; mise pulls a pinned
        # binary so the check is reproducible across runners.
        uses: jdx/mise-action@v4

      - name: Check usage(1) artifacts are fresh vs .usage.kdl
        # Fails the build if completions/, man/, or docs/cli/ drifted
        # since the last regen. Fix locally: `pnpm artifacts && git add
        # completions/ man/ docs/cli/`. Bypass: edit .usage.kdl + this
        # check together in the same PR.
        run: pnpm --filter "@george43g/*-mcp" check:usage

      - name: Verify npm tarball is publishable
        run: pnpm --filter "@george43g/*-mcp" exec npm pack --dry-run

      - name: Scaffolder E2E smoke (init → install → test)
        # Asserts the scaffolder's actual OUTPUT is buildable + testable,
        # not just that its own unit tests pass. Catches regressions where
        # the scaffolder lints + tests fine but emits broken workspace.
        # --no-rust-accel skips the napi crate in the scaffolded output so
        # the smoke runs in seconds (we still test Rust on the canonical
        # apps/rust-accel/ via the main build step).
        run: |
          set -euo pipefail
          SMOKE_DIR="$(mktemp -d)"
          echo "Scaffolding into $SMOKE_DIR"
          node apps/scaffolder/dist/cli.js init "$SMOKE_DIR" \
            --name golden --no-banner --no-rust-accel
          cd "$SMOKE_DIR"
          # --no-frozen-lockfile because the scaffolded output has no
          # pnpm-lock.yaml yet; pnpm defaults to frozen in CI environments.
          pnpm install --no-frozen-lockfile
          # Lint + typecheck + test + build — the same gates a consumer
          # would hit running `pnpm verify` immediately after init. Each
          # catches a different class of "scaffolder unit tests pass but
          # output is broken" regression.
          pnpm verify
          # Stress: 11 lifecycle assertions (handshake, health, parallel,
          # timeout, SIGTERM, RSS watchdog, HTTP roundtrip). Skipped if
          # --no-rust-accel removed the http transport; we kept HTTP in
          # this run so all 11 must pass.
          pnpm --filter "@george43g/*-mcp" stress

      - name: Stress harness (11 cases including HTTP)
        run: pnpm --filter "@george43g/*-mcp" stress

      - name: Example/ output stays in sync with scaffolder
        # Re-run the scaffolder with --name example, generate the usage(1)
        # artifacts the same way `pnpm regen:example` does locally, and
        # diff against the committed example/ directory. Catches scaffolder
        # changes (or .usage.kdl changes) that weren't accompanied by
        # `pnpm regen:example`.
        # Fix locally: `pnpm regen:example && git add example/ && git commit`.
        run: |
          set -euo pipefail
          EXAMPLE_TMP="$(mktemp -d)"
          node apps/scaffolder/dist/cli.js init "$EXAMPLE_TMP" --name example --no-banner
          # example/biome.json is intentionally stripped from the committed
          # reference (would be picked up by the parent biome as a competing
          # root config). Mirror that strip on the tempdir side.
          rm -f "$EXAMPLE_TMP/biome.json"
          # Regenerate completions / markdown docs / manpage inside the
          # tempdir so it matches what `pnpm regen:example` produces locally.
          # usage(1) is on PATH via the mise install step earlier in the job.
          # MISE_TRUSTED_CONFIG_PATHS is required because the tempdir lives
          # outside the repo's trusted workspace, so mise refuses to read
          # the freshly-scaffolded mise.toml without explicit consent.
          export MISE_TRUSTED_CONFIG_PATHS="$EXAMPLE_TMP"
          mise run --cd "$EXAMPLE_TMP/apps/example-mcp" docs
          mise run --cd "$EXAMPLE_TMP/apps/example-mcp" completions
          mise run --cd "$EXAMPLE_TMP/apps/example-mcp" manpage
          # Strip transient artifacts + the .git directory (only the tempdir
          # gets one — m3-git-init runs `git init` in fresh dirs but skips
          # inside the parent repo where example/ lives).
          for d in "$EXAMPLE_TMP" example; do
            find "$d" \( \
              -name .git -o \
              -name node_modules -o \
              -name dist -o \
              -name .turbo -o \
              -name coverage -o \
              -name '*.tsbuildinfo' \
            \) -prune -exec rm -rf {} + 2>/dev/null || true
          done
          if ! diff -r --no-dereference "$EXAMPLE_TMP" example; then
            echo "::error::example/ is stale vs scaffolder output. Run \`pnpm regen:example\` and commit."
            exit 1
          fi

      - name: Upload stress report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stress-report-${{ matrix.os }}
          path: apps/**/stress-*-report.json
          if-no-files-found: ignore
