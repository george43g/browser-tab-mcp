name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-latest proves the daemon BUILDS AND RUNS off macOS. The
        # connector extension is plain MV3 and already installs in Windows
        # Chrome, so the daemon is the only piece that was macOS-bound — it
        # shelled out to osascript, wrote a launchd plist, and bound a unix
        # socket, none of which exist there. Windows now uses a named pipe, a
        # Task Scheduler ONLOGON task, and the extension as its only data
        # source; without a runner, all three would be untested claims.
        #
        # macos-latest IS CONDITIONAL ON THIS REPO BEING PUBLIC. Standard
        # GitHub-hosted runners are free on public repos — macOS included, so
        # today this leg costs $0 and earns its slot by compiling rust-accel's
        # `#[cfg(target_os = "macos")]` CoreGraphics half, which no other
        # runner can even type-check. On a PRIVATE repo the same leg bills at
        # 10x Linux ($0.08/min): measured 2026-08-18, it was $10.48/day — 71%
        # of CI spend on 28% of the minutes — with healthy 3.2-min-median jobs.
        # The cost was volume times multiplier, not a stall. IF THIS REPO EVER
        # GOES PRIVATE AGAIN, DELETE THIS LEG THE SAME DAY; `pnpm verify:macos`
        # (.githooks/pre-push) already covers the gap, and more strictly —
        # it loads and calls the built .node rather than just compiling it.
        #
        # Every OS runs ONLY what is platform-specific: install → build →
        # test → stress. The OS-independent steps (lint, typecheck, coverage,
        # no-native, npm-pack, artifact freshness) are gated to Linux below —
        # running them per-OS was paying three times for one answer, which is
        # how one day of normal development cost $14.80.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["24"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.29.3

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Setup Rust
        # Linux compiles the stub half of rust-accel, macOS the real
        # CoreGraphics half — the one artifact only a Darwin runner can
        # type-check, and the reason the macOS leg exists at all. Windows
        # builds TS-only, which is exactly the shape a Windows user installs.
        if: runner.os != 'Windows'
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        # Source-only check with an identical result on every OS — running it
        # three times was paying three times for one answer.
        if: runner.os == 'Linux'
        run: pnpm lint

      - name: Shellcheck (safari packaging scripts)
        # Static analysis is OS-independent; run once on Linux. shellcheck is
        # preinstalled on GitHub's Ubuntu runners.
        if: runner.os == 'Linux'
        run: shellcheck apps/safari-extension/scripts/*.sh

      - name: Typecheck
        if: runner.os == 'Linux'
        run: pnpm typecheck

      - name: Build (TS workspace + optional native)
        run: pnpm build

      - name: Test (default — native path when built)
        run: pnpm test

      - name: Test (TS fallback path)
        # Only meaningful where a native module actually exists to disable;
        # Windows has no Rust toolchain here, so its default run IS this run.
        if: runner.os == 'Linux'
        env:
          MCP_DISABLE_NATIVE: "1"
        run: pnpm test:no-native

      - name: Coverage (collect + report — non-gating)
        # COVERAGE=1 collects + writes lcov (CI reporter). COVERAGE_GATE is
        # intentionally unset: we report coverage but don't fail on thresholds
        # yet. Arm the gate later by adding COVERAGE_GATE: "1" below.
        #
        # Set via `env:` rather than a `COVERAGE=1 pnpm test` prefix — that
        # prefix is POSIX-only and is a syntax error under cmd.exe on the
        # windows-latest leg.
        if: runner.os == 'Linux'
        env:
          COVERAGE: "1"
        run: pnpm test
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: "**/coverage/lcov.info"
          if-no-files-found: ignore

      # mise has no Windows story here, and the artifacts it checks
      # (completions/, man/) are POSIX shell + manpages — regenerating them on
      # Windows would prove nothing.
      - name: Install usage(1) via mise
        if: runner.os == 'Linux'
        # The freshness gate (next step) shells out to usage(1) to
        # regenerate completions + manpage + docs; mise pulls a pinned
        # binary so the check is reproducible across runners.
        uses: jdx/mise-action@v4

      - name: Check usage(1) artifacts are fresh vs .usage.kdl
        # Fails the build if completions/, man/, or docs/cli/ drifted
        # since the last regen. Fix locally: `pnpm artifacts && git add
        # completions/ man/ docs/cli/`. Bypass: edit .usage.kdl + this
        # check together in the same PR.
        if: runner.os == 'Linux'
        run: pnpm --filter "@george43g/*-mcp" check:usage

      - name: Verify npm tarball is publishable
        if: runner.os == 'Linux'
        run: pnpm --filter "@george43g/*-mcp" exec npm pack --dry-run

      - name: Stress harness (10 cases · daemon + dispatch lifecycle)
        run: pnpm --filter "@george43g/*-mcp" stress
      - name: Upload stress report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stress-report-${{ matrix.os }}
          path: apps/**/stress-*-report.json
          if-no-files-found: ignore

  # Headed-Chromium (new-headless) E2E of the BUILT extension against a
  # throwaway, HOME-isolated daemon: load dist/ → connect over loopback →
  # daemon-driven cross-window move preserves scroll. Own job (adds a browser),
  # off the hot matrix. Safari is NOT automatable — keep the manual smoke
  # checklist in apps/safari-extension/README.md. See docs/FOLLOWUPS.md § 1 (P3).
  e2e-chromium:
    name: e2e (chromium)
    runs-on: ubuntu-latest
    # Room for two browser-install attempts (see that step) plus the tests,
    # which take well under a minute. Raised from 15 after an apt stall ate the
    # entire budget and the tests never ran.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.29.3

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (extension bundle + daemon CLI)
        run: pnpm build

      # WHY THIS IS NOT A ONE-LINER. `--with-deps` shells out to apt, and apt on
      # a GitHub runner talks to a mirror that can simply stop answering: on
      # 2026-08-18 `azure.archive.ubuntu.com` went unreachable, apt fell back to
      # `archive.ubuntu.com` and then hung for 13.5 minutes until the JOB
      # timeout cancelled everything. The e2e tests never ran, and the only
      # signal was a red X on a PR whose code was fine.
      #
      # An unbounded step inside a bounded job spends the whole budget on the
      # slowest thing that can happen to it. Bounding the step instead turns a
      # 15-minute mystery cancellation into a fast failure with a retry — and
      # because a stalled mirror is usually a different mirror by the next
      # attempt, one retry is nearly always enough. The apt list cache is wiped
      # in between so the retry re-resolves rather than re-reading the state
      # that just failed.
      #
      # `timeout` (coreutils) rather than step-level `timeout-minutes` +
      # `continue-on-error`, because the semantics of a cancelled step are one
      # more thing to be wrong about; this is plain shell and does exactly what
      # it says.
      - name: Install Playwright chromium (+ OS deps)
        run: |
          set -euo pipefail
          install() {
            pnpm --filter @george43g/chrome-extension exec playwright install --with-deps chromium
          }
          if ! timeout 360 bash -c "$(declare -f install); install"; then
            echo "::warning::Playwright browser install stalled or failed (usually an apt mirror). Retrying once."
            sudo rm -rf /var/lib/apt/lists/*
            timeout 360 bash -c "$(declare -f install); install"
          fi

      - name: Run e2e (built extension ↔ throwaway daemon)
        run: pnpm --filter @george43g/chrome-extension test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/chrome-extension/playwright-report/
            apps/chrome-extension/test-results/
          if-no-files-found: ignore
