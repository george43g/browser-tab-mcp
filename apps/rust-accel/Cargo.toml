[package]
name = "rust-accel"
version = "0.0.0"
edition = "2021"
description = "Optional Rust acceleration for the browser-tab-mcp starter template"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi9", "async", "tokio_rt"] }
napi-derive = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CGWindowList access for yabai window-id correlation. macOS-only so the
# CI ubuntu matrix (and any non-mac contributor) still builds the crate;
# the TS side gets an empty vec elsewhere.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
